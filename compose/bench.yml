# Load generator, run on the compose network next to the servers.
# Deliberately not named compose.*.yml so `make up` doesn't start it.
#   docker compose -f compose/bench.yml run --rm bench --bench latency --server go
services:
  bench:
    build:
      context: ..
      dockerfile: benches/Dockerfile
    cpuset: "${CLIENT_CPUS:-4-9}"
    volumes:
      - ../results:/app/results
