# url -- where the bench client connects
# cmd -- how `runner.py --spawn` starts the server (run with the current Python)
servers:
  fastapi:
    url: "http://127.0.0.1:8001"
    cmd: [servers/fastapi/app.py, --host, 127.0.0.1, --port, "8001"]
    protocol: http
  grpc:
    url: "127.0.0.1:8002"
    cmd: [servers/grpc/server.py, --host, 127.0.0.1, --port, "8002"]
    protocol: grpc
  fastapi_queue:
    url: "http://127.0.0.1:8003"
    cmd: [servers/fastapi_queue/app.py, --host, 127.0.0.1, --port, "8003"]
    protocol: http
    pattern: queue
  fastapi_msgpack:
    url: "http://127.0.0.1:8004"
    cmd: [servers/fastapi_msgpack/app.py, --host, 127.0.0.1, --port, "8004"]
    protocol: msgpack
  fastapi_batched:
    url: "http://127.0.0.1:8006"
    cmd: [servers/fastapi_batched/app.py, --host, 127.0.0.1, --port, "8006"]
    protocol: http

client:
  # Max client processes; each level uses min(processes, concurrency).
  processes: 4

benches:
  latency:
    warmup_s: 2
    duration_s: 10
  throughput:
    warmup_s: 5
    duration_s: 30
    concurrency: 16
  concurrency:
    levels: [1, 4, 8, 16, 32, 64]
    warmup_s: 2
    duration_s: 10
