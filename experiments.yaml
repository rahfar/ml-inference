# Each experiment holds some settings fixed and varies others. Every
# combination of the `vary` lists is one variant; each variant gets a fresh
# server process and is measured at every concurrency level.
#
#   uv run python -m bench.run <experiment>

defaults:
  stack: fastapi+uvicorn  # web framework + HTTP server, see serving/app.py
  threads: 4  # threads per predict() call; match your performance cores
  workers: 1  # inference threads, batched only (and the C++ server)
  samples: 1  # rows per request
  levels: [1, 4, 16, 64]  # concurrent users
  warmup_s: 2
  duration_s: 10
  client_processes: 4

experiments:
  # 1. Where and when predict() runs. Everything else fixed.
  strategy:
    fixed: {codec: json}
    vary:
      model: [noop, catboost, lstm]
      strategy: [inline_loop, inline_threadpool, serial, batched]

  # 1b. Follow-up to 1: batched with several inference workers vs the thread
  #     pool, each with 1 or 4 torch threads per predict() call.
  batched_workers:
    fixed: {codec: json, strategy: batched}
    vary:
      model: [catboost, lstm]
      workers: [1, 4]
      threads: [1, 4]
  threadpool_ref:
    fixed: {codec: json, strategy: inline_threadpool}
    vary:
      model: [catboost, lstm]
      threads: [1, 4]

  # 2. Wire format, at growing payloads. Strategy fixed to the winner of 1.
  codec:
    fixed: {strategy: batched}
    vary:
      model: [noop, catboost, lstm]
      codec: [json, msgpack, protobuf, raw]
      samples: [1, 32, 512]
    levels: [1, 16]

  # 3. Web framework + HTTP server. Strategy fixed to inline_threadpool: the
  #    only one a sync (WSGI) app can express. Each request then runs in one
  #    of the server's threads, like a sync FastAPI handler.
  stack:
    fixed: {strategy: inline_threadpool, codec: json}
    vary:
      model: [noop, catboost, lstm]
      stack: [fastapi+uvicorn, starlette+uvicorn, fastapi+granian, starlette+granian, flask+gunicorn, flask+granian]

  # 4. Python vs C++ (cpp/server.cpp), each at its best setup: batching, one
  # torch thread per inference worker. workers=1 suits cheap models, 4 the LSTM.
  cpp:
    fixed: {codec: json, strategy: batched, threads: 1}
    vary:
      model: [noop, catboost, lstm]
      stack: [fastapi+uvicorn, cpp]
      workers: [1, 4]
