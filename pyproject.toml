[project]
name = "ml-inference-bench"
version = "0.1.0"
description = "What is the most efficient way to serve a model behind an API, in one Python process?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "msgpack",
    "protobuf",
    "aiohttp",
    "pyyaml",
    "catboost>=1.2.10",
]

[dependency-groups]
dev = [
    "grpcio-tools",  # protoc, for `make proto`
    "ruff>=0.15.8",
    "ty>=0.0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "serving", "bench"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
extend-exclude = ["serving/tensor_pb2.py"]
