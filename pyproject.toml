[project]
name = "ml-inference-bench"
version = "0.1.0"
description = "Benchmark and compare PyTorch serving strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # model + servers
    "torch",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "grpcio",
    "protobuf",
    "msgpack",
    # bench runner
    "aiohttp",
    "pyyaml",
]

[dependency-groups]
dev = [
    "grpcio-tools",  # make proto
    "ruff>=0.15.8",
    "ty>=0.0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model", "servers", "benches"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
